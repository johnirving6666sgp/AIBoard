<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIBoard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">智能体协作控制台</p>
          <h1>AIBoard</h1>
        </div>
        <div class="top-actions">
          <input id="searchInput" class="search" type="search" placeholder="搜索事件" />
          <button id="refreshButton" class="icon-button" title="刷新" aria-label="刷新">
            <span aria-hidden="true">刷</span>
          </button>
        </div>
      </header>

      <section id="cockpit" class="cockpit" aria-label="今日驾驶舱"></section>

      <main class="workspace">
        <aside class="sidebar">
          <nav class="tabs" aria-label="视图">
            <button class="tab active" data-view="now">现在</button>
            <button class="tab" data-view="research_flow">研究全局</button>
            <button class="tab" data-view="research_queue">待研究候选</button>
            <button class="tab" data-view="activity">智能体动态</button>
            <button class="tab" data-view="artifacts">产出文件</button>
            <button class="tab" data-view="tracking_update">持仓跟踪</button>
            <button class="tab" data-view="debug">系统调试</button>
            <button class="tab" data-view="history">历史归档</button>
          </nav>

          <div id="eventList" class="event-list"></div>
        </aside>
      </main>

      <section class="lower-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>产出文件</h2>
            <span id="artifactCount" class="muted"></span>
          </div>
          <div id="artifactList" class="artifact-list"></div>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>OpenClaw 队列 / 结果</h2>
            <div class="button-row">
              <span id="commandCount" class="muted"></span>
              <button id="runAdaptersButton" class="secondary-button" type="button">运行队列</button>
            </div>
          </div>
          <div id="commandList" class="command-list"></div>
          <section id="openClawPreviewWrap" class="detail-section" hidden>
            <h2>OpenClaw Markdown</h2>
            <pre id="openClawPreview" class="markdown-preview"></pre>
          </section>
        </section>

        <section class="panel">
          <div class="panel-header">
            <h2>手动接入</h2>
            <div class="button-row">
              <button id="importInboxButton" class="secondary-button" type="button">导入 Inbox</button>
              <button id="importVaultButton" class="secondary-button" type="button">立即同步 Vault</button>
              <button id="importAgentsButton" class="secondary-button" type="button">导入智能体</button>
            </div>
          </div>
          <p id="importResult" class="import-result muted">把 .md、.txt 或 .json 文件放进 inbox/ 即可导入。</p>
          <p id="vaultStatus" class="import-result muted"></p>
          <form id="intakeForm" class="intake-form">
            <div class="form-row">
              <label>
                来源
                <select name="source">
                  <option value="hermes">Hermes</option>
                  <option value="openclaw">OpenClaw</option>
                  <option value="vault">Vault</option>
                  <option value="manual">手动</option>
                </select>
              </label>
              <label>
                类型
                <select name="type">
                  <option value="">自动判断</option>
                  <option value="research_queue">研究队列</option>
                  <option value="tracking_update">跟踪更新</option>
                  <option value="finding">发现</option>
                  <option value="artifact">产出文件</option>
                  <option value="question">待确认</option>
                  <option value="alert">提醒</option>
                </select>
              </label>
            </div>
            <label>
              标题
              <input name="title" type="text" placeholder="可选标题" />
            </label>
            <label>
              原始输出
              <textarea name="rawContent" rows="5" placeholder="粘贴智能体输出"></textarea>
            </label>
            <button class="primary-button" type="submit">接入事件</button>
          </form>
        </section>
      </section>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
